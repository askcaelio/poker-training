[project]
name = "poker-training"
version = "0.1.0"
description = "Texas Hold'em training tool focused on probability intuition, equity, pot odds, and EV."
requires-python = ">=3.12"
dependencies = [
    "treys>=0.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
